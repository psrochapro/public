<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Viewer - Camera</title>
    <!-- Vendor Scripts -->
    <script src="vendor/aframe.min.js"></script>
    <script src="vendor/ar.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets id="asset-container">
            <!-- Asset will be injected here -->
        </a-assets>

        <!-- Hiro Marker -->
        <a-marker preset="hiro">
            <a-image id="ar-image" position="0 0 0" rotation="-90 0 0" width="2" height="2"></a-image>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <div id="ar-ui">
        <button onclick="window.location.href='index.html'">Back to Catalog</button>
    </div>

    <script src="js/ar-handler.js"></script>
</body>
</html>
