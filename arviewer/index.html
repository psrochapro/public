<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Viewer - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Image Catalog</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search images...">
        </div>
    </header>

    <main>
        <div id="imageGrid" class="image-grid">
            <!-- Images will be rendered here -->
        </div>
        <div id="pagination" class="pagination">
            <!-- Pagination buttons -->
        </div>

        <section class="instructions-section">
            <hr>
            <h3>How to use AR</h3>
            <p>1. Click an image above to generate a QR code.</p>
            <p>2. Scan the QR code with your phone.</p>
            <p>3. When the camera opens, point it at the <strong>Hiro Marker</strong> below:</p>
            <div class="marker-container">
                <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Hiro Marker" style="width: 150px; border: 1px solid #ccc;">
                <p><small>Hiro Marker (Standard AR Trigger)</small></p>
            </div>
        </section>
    </main>

    <!-- QR Modal -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>AR QR Code</h2>
            <p id="qrTitle"></p>
            <div id="qrcode"></div>
            <p class="instruction">Scan and point camera at the Hiro Marker</p>
        </div>
    </div>

    <!-- Vendor Scripts -->
    <script src="vendor/qrcode.min.js"></script>
    <!-- Logic Scripts -->
    <script src="js/qr-manager.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
