<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Viewer - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Image Catalog</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search images...">
        </div>
    </header>

    <main>
        <div id="imageGrid" class="image-grid">
            <!-- Images will be rendered here -->
        </div>
        <div id="pagination" class="pagination">
            <!-- Pagination buttons -->
        </div>

        <section class="instructions-section">
            <hr>
            <h3>How to use AR</h3>
            <p>1. Click an image above to generate a QR-Marker.</p>
            <p>2. Scan the QR code with your phone to open the viewer.</p>
            <p>3. Once the camera is active, point it at the <strong>entire black square</strong> surrounding the QR code.</p>
        </section>
    </main>

    <!-- QR Modal -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>AR QR Code</h2>
            <p id="qrTitle"></p>
            
            <div class="qr-marker-wrapper">
                <div id="qrcode"></div>
            </div>
            
            <p class="instruction">Scan and then point your camera at the black square.</p>
        </div>
    </div>

    <!-- Vendor Scripts -->
    <script src="vendor/qrcode.min.js"></script>
    <!-- Logic Scripts -->
    <script src="js/qr-manager.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
