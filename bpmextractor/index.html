<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPMN to Table - FAPESC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Conversor BPMN para Atividades</h1>
            <p>Gere tabelas em Arial 9pt, entrelinha simples, prontas para o Google Docs.</p>
        </header>

        <main>
            <div class="upload-section">
                <input type="file" id="bpmnFile" accept=".xml,.bpmn,.txt">
                <label for="bpmnFile" class="btn-upload">Selecionar Arquivo</label>
                <span id="fileName">Nenhum arquivo selecionado</span>
            </div>

            <div id="actionsContainer" class="actions-container" style="display: none;">
                <button id="btnCopy" class="btn-copy">Copiar para Template Google Docs</button>
            </div>

            <div id="tableContainer" class="table-container">
                <!-- A tabela será gerada aqui -->
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
