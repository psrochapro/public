<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Master - Conversor & Crop</title>
    <link rel="stylesheet" href="vendor/cropper.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Image Master <span>Conversor & Crop</span></h1>
            <div class="upload-area">
                <input type="file" id="imageInput" accept="image/*" hidden>
                <button class="btn btn-primary" onclick="document.getElementById('imageInput').click()">
                    Selecionar Imagem
                </button>
            </div>
        </header>

        <main class="app-content">
            <!-- Coluna Esquerda: Editor -->
            <div class="editor-pane">
                <div class="canvas-container">
                    <img id="imageSource" style="max-width: 100%;">
                    <div id="uploadPlaceholder" class="placeholder">
                        <p>Nenhuma imagem carregada.</p>
                    </div>
                </div>
                
                <div class="ratio-controls" id="ratioControls">
                    <button class="btn btn-sm btn-outline active" data-ratio="NaN">Livre</button>
                    <button class="btn btn-sm btn-outline" data-ratio="1">1:1</button>
                    <button class="btn btn-sm btn-outline" data-ratio="1.3333333333333333">4:3</button>
                    <button class="btn btn-sm btn-outline" data-ratio="1.7777777777777777">16:9</button>
                    <button class="btn btn-sm btn-outline" data-ratio="0.6666666666666666">2:3</button>
                </div>
            </div>

            <!-- Coluna Direita: Controles -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>Dimensões</h3>
                    <div class="dimension-box">
                        <div class="dim-label">Resolução do Corte: <span id="currentDim">0 x 0</span></div>
                        <div class="form-group" style="margin-top: 10px;">
                            <label>Largura de Saída (px)</label>
                            <input type="number" id="targetWidth" class="form-control" placeholder="Original">
                        </div>
                        <div class="dim-label">Saída Final: <span id="finalDim">0 x 0</span></div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Exportar</h3>
                    <div class="form-group">
                        <label>Formato de Saída</label>
                        <select id="exportFormat" class="form-control">
                            <option value="image/png">PNG (Transparência)</option>
                            <option value="image/webp" selected>WebP (Recomendado)</option>
                            <option value="image/avif">AVIF (Alta Performance)</option>
                            <option value="image/jpeg">JPEG (Sem Transp.)</option>
                        </select>
                        <div id="formatWarning" class="warning-text" style="display: none;">
                            ⚠️ O navegador salvará como PNG (AVIF não suportado).
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Qualidade: <span id="qualityVal">90%</span></label>
                        <input type="range" id="exportQuality" min="0.1" max="1" step="0.05" value="0.9" class="form-control-range">
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Transparência</h3>
                    <div class="form-group">
                        <label>Remover cor específica</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="removeColor" value="#ffffff">
                            <button id="btnRemoveColor" class="btn btn-sm">Ativar</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Tolerância: <span id="toleranceVal">40</span></label>
                        <input type="range" id="toleranceRange" min="1" max="150" value="40" class="form-control-range">
                    </div>
                </div>

                <div class="sidebar-actions">
                    <button id="downloadBtn" class="btn btn-success btn-large" disabled>Baixar Imagem</button>
                </div>

                <div class="preview-info" id="previewInfo">
                    <div id="sizeBadge" class="info-badge" style="display: none;">
                        Peso estimado: <strong id="fileSizeDisplay">--</strong>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="vendor/cropper.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
